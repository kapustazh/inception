user www-data;
worker_processes auto;
pid /run/nginx.pid;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr;
    server {
        listen 8080;
        root /var/www/site;
        index index.html;
        location / { try_files $uri $uri/ =404; }
    }
}
